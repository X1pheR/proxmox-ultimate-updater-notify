<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic ntfy update notification preview</title>
  <desc id="desc">A dark ntfy-style notification forwarding Ultimate Updater native status with security and normal counts plus a reboot-required target.</desc>
  <rect width="1000" height="610" rx="6" fill="#24292e"/>
  <text x="30" y="38" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700">Example</text>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="962" y1="27" x2="978" y2="43"/>
    <line x1="978" y1="27" x2="962" y2="43"/>
  </g>
  <text x="30" y="78" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600">📦  Ultimate Updater: Updates available</text>
  <text x="30" y="120" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Ultimate Updater status</text>
  <text x="30" y="150" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">=======================</text>
  <text x="30" y="195" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Available updates:</text>
  <text x="30" y="235" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">🖥️ proxmox</text>
  <text x="30" y="265" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">S: 2 / N: 1</text>
  <text x="30" y="305" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">🐧 201 · dns</text>
  <text x="30" y="335" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">S: 1 / N: 0</text>
  <text x="30" y="375" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">🐧 301 · docker-host</text>
  <text x="30" y="405" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">S: 0 / N: 2</text>
  <text x="30" y="455" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Total available updates: 6</text>
  <text x="30" y="505" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Reboot required:</text>
  <text x="30" y="535" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">🔄 docker-host</text>
  <text x="30" y="585" fill="#aeb6bf" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Synthetic example data · no real hostnames, VM IDs, or package state</text>
</svg>
