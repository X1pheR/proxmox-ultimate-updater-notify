name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '\r\n' < VERSION)"
          test "$actual" = "$expected"

      - name: Run release checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh src/proxmox-ultimate-updater-notify tests/run.sh
          shellcheck install.sh src/proxmox-ultimate-updater-notify tests/run.sh
          bash tests/run.sh
          sudo install -m 0755 src/proxmox-ultimate-updater-notify /usr/local/libexec/proxmox-ultimate-updater-notify
          systemd-analyze verify systemd/*.service systemd/*.timer systemd/*.path

      - name: Build source archive and checksum
        run: |
          archive="proxmox-ultimate-updater-notify-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="proxmox-ultimate-updater-notify-${GITHUB_REF_NAME}/" -o "$archive" "$GITHUB_SHA"
          sha256sum "$archive" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "proxmox-ultimate-updater-notify-${GITHUB_REF_NAME}.tar.gz" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes
